name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ChessEngine/ChessEngine.csproj
      - run: dotnet run --project ChessEngine/ChessEngine.csproj
